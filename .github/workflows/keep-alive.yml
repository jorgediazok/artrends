name: Backend keep-alive

# Render's free tier spins the backend down after 15 min of inactivity,
# causing ~30-50s cold starts for whoever hits the site next. This pings
# a lightweight /health route (no DB/cache work) every 14 min, but only
# during 8:00-00:00 Argentina time (11:00-02:59 UTC) so it sleeps
# overnight when there's basically no traffic. Keeps usage well under
# Render's 750 free instance-hours/month.

on:
  schedule:
    - cron: "*/14 11-23 * * *"
    - cron: "*/14 0-2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS https://artrends-backend.onrender.com/health
