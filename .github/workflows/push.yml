name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-workers:
    runs-on: ubuntu-latest
    name: Deploy workers if needed
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Look for changes in workers
        id: changed-files-in-workers
        uses: tj-actions/changed-files@v34
        with:
          files: workers/**

      - name: Set up QEMU
        if: steps.changed-files-in-workers.outputs.any_changed == 'true'
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        if: steps.changed-files-in-workers.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v2
      - name: Docker Hub login
        if: steps.changed-files-in-workers.outputs.any_changed == 'true'
        uses: docker/login-action@v2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        if: steps.changed-files-in-workers.outputs.any_changed == 'true'
        uses: docker/build-push-action@v3
        with:
          context: ./workers
          file: "./workers/Dockerfile"
          push: true
          tags: ${{secrets.WORKERS_DOCKER_IMAGE_TAG}}
      - name: Pull image and re-start container in cloud server
        if: success() && steps.changed-files-in-workers.outputs.any_changed == 'true'
        uses: appleboy/ssh-action@master
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORKERS_PROD_ENV: ${{secrets.WORKERS_PROD_ENV}}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          password: ${{ secrets.PROD_PASSWORD }}
          port: ${{ secrets.PROD_PORT }}
          script: |
            cd /root/artrends/workers
            echo -e "${{secrets.WORKERS_PROD_ENV}}" > .env
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{secrets.WORKERS_DOCKER_IMAGE_TAG}}
            docker compose up -d
  build-backend:
    runs-on: ubuntu-latest
    name: Deploy backend if needed
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Look for changes in backend
        id: changed-files-in-backend
        uses: tj-actions/changed-files@v34
        with:
          files: backend/**

      - name: Set up QEMU
        if: steps.changed-files-in-backend.outputs.any_changed == 'true'
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        if: steps.changed-files-in-backend.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v2
      - name: Docker Hub login
        if: steps.changed-files-in-backend.outputs.any_changed == 'true'
        uses: docker/login-action@v2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        if: steps.changed-files-in-backend.outputs.any_changed == 'true'
        uses: docker/build-push-action@v3
        with:
          context: ./backend
          file: "./backend/Dockerfile"
          push: true
          tags: ${{secrets.BACKEND_DOCKER_IMAGE_TAG}}
      - name: Pull image and re-start container in cloud server
        if: success() && steps.changed-files-in-backend.outputs.any_changed == 'true'
        uses: appleboy/ssh-action@master
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          BACKEND_PROD_ENV: ${{secrets.BACKEND_PROD_ENV}}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          password: ${{ secrets.PROD_PASSWORD }}
          port: ${{ secrets.PROD_PORT }}
          script: |
            cd /root/artrends/backend
            echo -e "${{secrets.BACKEND_PROD_ENV}}" > .env
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{secrets.BACKEND_DOCKER_IMAGE_TAG}}
            docker compose up -d
  build-frontend:
    runs-on: ubuntu-latest
    name: Deploy frontend if needed
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Look for changes in frontend
        id: changed-files-in-frontend
        uses: tj-actions/changed-files@v34
        with:
          files: frontend/**

      - name: Set up QEMU
        if: steps.changed-files-in-frontend.outputs.any_changed == 'true'
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        if: steps.changed-files-in-frontend.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v2
      - name: Docker Hub login
        if: steps.changed-files-in-frontend.outputs.any_changed == 'true'
        uses: docker/login-action@v2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        if: steps.changed-files-in-frontend.outputs.any_changed == 'true'
        uses: docker/build-push-action@v3
        with:
          context: ./frontend
          file: "./frontend/Dockerfile"
          push: true
          tags: ${{secrets.FRONTEND_DOCKER_IMAGE_TAG}}
      - name: Pull image and re-start container in cloud server
        if: success() && steps.changed-files-in-frontend.outputs.any_changed == 'true'
        uses: appleboy/ssh-action@master
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          FRONTEND_PROD_ENV: ${{secrets.FRONTEND_PROD_ENV}}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          password: ${{ secrets.PROD_PASSWORD }}
          port: ${{ secrets.PROD_PORT }}
          script: |
            cd /root/artrends/frontend
            echo -e "${{secrets.FRONTEND_PROD_ENV}}" > .env
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{secrets.FRONTEND_DOCKER_IMAGE_TAG}}
            docker compose up -d
