version: "2.6"

name: artrends
services:
  traefik:
    image: traefik:v2.8
    # Enables the Traefik Dashboard and tells Traefik to listen to docker
    # enable --log.level=INFO so we can see what Traefik is doing in the log files
    ports:
      # Exposes port 80 and 433 for incomming web requests
      - "80:80"
      - "443:443"
      # The Web UI port http://0.0.0.0:8080 (enabled by --api.insecure=true)
      - "8080:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/traefik.yml:/etc/traefik/traefik.yml
  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    command: --quiet
    volumes:
      - mongodb-data:/data/db
  redis:
    container_name: redis
    image: redis:7.0.4-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --loglevel warning  --appendonly yes --requirepass "***REMOVED_REDIS_PASSWORD***"
    volumes:
      - cache:/data
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: always
    ports:
      - 3500:3500
    volumes:
      - .:/app
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`artrends-api.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web,websecure"

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    restart: always
    ports:
      - 3000:3000
    volumes:
      - .:/app
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`artrends-front.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web,websecure"

  scrapers:
    container_name: workers
    build:
      context: .
      dockerfile: ./workers/Dockerfile
    restart: always
    security_opt:
      - seccomp:./workers/seccomp_profile.json
    volumes:
      - .:/app
    ipc: "host"

volumes:
  mongodb-data:
    name: mongodb-data
  cache:
    driver: local
